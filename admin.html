<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoojaNow Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --saffron: #e8871e;
        --saffron-dark: #c96a0f;
        --marigold: #f2a93c;
        --maroon: #8b2635;
        --maroon-deep: #6b1420;
        --gold: #c9973e;
        --gold-light: #f0d9a8;
        --ivory: #fff9f1;
        --ivory-warm: #fdefdd;
        --cream-card: #ffffff;
        --charcoal: #3d2817;
        --muted: #9c8570;
        --line: #f0e1c8;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Poppins", sans-serif;
        background: var(--ivory);
        color: var(--charcoal);
        min-height: 100vh;
      }
      h1,
      h2,
      h3 {
        font-family: "Cormorant Garamond", serif;
      }

      /* ---- Login ---- */
      #loginScreen {
        max-width: 380px;
        margin: 90px auto;
        padding: 30px;
        background: var(--cream-card);
        border-radius: 20px;
        border: 1px solid var(--line);
        box-shadow: 0 10px 30px rgba(139, 38, 53, 0.08);
      }
      #loginScreen h1 {
        color: var(--maroon);
        font-size: 26px;
        margin-bottom: 4px;
      }
      #loginScreen p {
        font-size: 12.5px;
        color: var(--muted);
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 14px;
      }
      .form-group label {
        font-size: 12px;
        font-weight: 600;
        color: var(--maroon-deep);
        display: block;
        margin-bottom: 6px;
      }
      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 11px 13px;
        border-radius: 10px;
        border: 1.5px solid var(--line);
        font-family: "Poppins", sans-serif;
        font-size: 13.5px;
        background: var(--ivory);
      }
      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: var(--gold);
      }
      .btn {
        background: linear-gradient(
          135deg,
          var(--marigold),
          var(--saffron-dark)
        );
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 13.5px;
        cursor: pointer;
        font-family: "Poppins", sans-serif;
        transition: transform 0.15s var(--ease);
      }
      .btn:active {
        transform: scale(0.96);
      }
      .btn.secondary {
        background: var(--ivory-warm);
        color: var(--maroon-deep);
        border: 1px solid var(--line);
      }
      .btn.danger {
        background: #c0392b;
      }
      .btn.small {
        padding: 7px 12px;
        font-size: 11.5px;
      }
      #loginError {
        color: #c0392b;
        font-size: 12px;
        margin-top: 8px;
        display: none;
      }

      /* ---- Dashboard shell ---- */
      #dashboard {
        display: none;
      }
      .topbar {
        background: var(--cream-card);
        border-bottom: 1px solid var(--line);
        padding: 14px 22px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky;
        top: 0;
        z-index: 20;
      }
      .topbar h1 {
        color: var(--maroon);
        font-size: 24px;
      }
      .tabs {
        display: flex;
        gap: 8px;
        padding: 16px 22px 0;
      }
      .tab {
        padding: 9px 18px;
        border-radius: 10px 10px 0 0;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        color: var(--muted);
        background: var(--ivory-warm);
      }
      .tab.active {
        background: var(--cream-card);
        color: var(--maroon-deep);
      }
      .tab-content {
        display: none;
        padding: 18px 22px 60px;
        max-width: 900px;
        margin: 0 auto;
      }
      .tab-content.active {
        display: block;
      }

      /* ---- Orders ---- */
      .order-card {
        background: var(--cream-card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 14px;
      }
      .order-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 10px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .order-id {
        font-weight: 700;
        color: var(--maroon-deep);
        font-size: 15px;
      }
      .order-time {
        font-size: 11px;
        color: var(--muted);
      }
      .status-pill {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
      }
      .status-pill.placed {
        background: #fdefdd;
        color: #c96a0f;
      }
      .status-pill.packed {
        background: #e7f0d8;
        color: #5a7a2a;
      }
      .status-pill.out_for_delivery {
        background: #dcebf7;
        color: #2a6a9a;
      }
      .status-pill.delivered {
        background: #dcf3e3;
        color: #2a7a4a;
      }
      .order-detail-row {
        font-size: 12.5px;
        color: var(--charcoal);
        margin-bottom: 3px;
      }
      .order-detail-row b {
        color: var(--maroon-deep);
      }
      .repeat-tag {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 700;
        background: #eae0f5;
        color: #6b3fa0;
        padding: 2px 9px;
        border-radius: 6px;
        margin-left: 4px;
      }
      .paid-tag {
        display: inline-block;
        font-size: 10.5px;
        font-weight: 700;
        background: #e2f5e5;
        color: #1e7a34;
        padding: 2px 9px;
        border-radius: 6px;
        margin-left: 6px;
      }
      .order-items {
        margin: 10px 0;
        padding: 10px 12px;
        background: var(--ivory-warm);
        border-radius: 10px;
        font-size: 12.5px;
      }
      .order-items div {
        padding: 2px 0;
      }
      .order-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      .notes-row {
        margin-top: 10px;
        display: flex;
        gap: 8px;
      }
      .notes-row input {
        flex: 1;
      }
      .order-filter-row {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      .filter-btn {
        padding: 8px 16px;
        border-radius: 10px;
        border: 1.5px solid var(--line);
        background: var(--cream-card);
        color: var(--charcoal);
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: "Poppins", sans-serif;
        transition: all 0.2s var(--ease);
      }
      .filter-btn.active {
        background: linear-gradient(
          135deg,
          var(--marigold),
          var(--saffron-dark)
        );
        color: white;
        border-color: transparent;
      }
      .order-summary-strip {
        background: var(--ivory-warm);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 18px;
        margin-bottom: 18px;
        display: flex;
        gap: 28px;
        flex-wrap: wrap;
      }
      .summary-stat-value {
        font-size: 19px;
        font-weight: 700;
        color: var(--maroon-deep);
      }
      .summary-stat-label {
        font-size: 10.5px;
        color: var(--muted);
        margin-top: 2px;
      }

      /* ---- Catalog ---- */
      .cat-block {
        background: var(--cream-card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .cat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .cat-header h3 {
        color: var(--maroon-deep);
        font-size: 17px;
      }
      .prod-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .prod-row:last-child {
        border-bottom: none;
      }
      .prod-actions {
        display: flex;
        gap: 6px;
      }
      .inline-form {
        display: flex;
        gap: 8px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .inline-form input {
        flex: 1;
        min-width: 80px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1.5px solid var(--line);
        font-size: 12.5px;
      }
      .top-actions {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .empty-note {
        color: var(--muted);
        font-size: 13px;
        text-align: center;
        padding: 30px;
      }

      /* ---- Edit item modal ---- */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(61, 40, 23, 0.45);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 200;
        padding: 20px;
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal-box {
        background: var(--cream-card);
        border-radius: 18px;
        padding: 24px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 20px 50px rgba(139, 38, 53, 0.2);
      }
      .modal-box h3 {
        color: var(--maroon-deep);
        font-size: 19px;
        margin-bottom: 16px;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .modal-actions .btn {
        flex: 1;
      }
      .modal-img-preview {
        width: 100%;
        max-width: 160px;
        height: 120px;
        object-fit: cover;
        border-radius: 10px;
        margin-bottom: 8px;
        display: block;
        border: 1px solid var(--line);
      }

      /* ---- Thumbnails (real images, no emoji) ---- */
      .thumb-img {
        width: 36px;
        height: 36px;
        object-fit: cover;
        border-radius: 8px;
        flex-shrink: 0;
        border: 1px solid var(--line);
      }
      .thumb-placeholder {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        flex-shrink: 0;
        border: 1px dashed var(--line);
        background: var(--ivory-warm);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .thumb-placeholder svg {
        width: 16px;
        height: 16px;
        opacity: 0.5;
      }
      .prod-row-main {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cat-header-main {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* ---- Category grid (drill-down navigation) ---- */
      .cat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 14px;
      }
      .cat-card {
        background: var(--cream-card);
        border: 1px solid var(--line);
        border-radius: 16px;
        overflow: hidden;
        cursor: pointer;
        transition:
          transform 0.15s var(--ease),
          box-shadow 0.15s var(--ease);
      }
      .cat-card:active {
        transform: scale(0.96);
      }
      .cat-card:hover {
        box-shadow: 0 8px 20px rgba(139, 38, 53, 0.1);
      }
      .cat-card-thumb {
        width: 100%;
        aspect-ratio: 1/0.85;
        background: var(--ivory-warm);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .cat-card-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cat-card-thumb svg {
        width: 32px;
        height: 32px;
        opacity: 0.4;
      }
      .cat-card-info {
        padding: 12px;
      }
      .cat-card-name {
        font-size: 14px;
        font-weight: 700;
        color: var(--maroon-deep);
      }
      .cat-card-count {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .cat-reorder-row {
        display: flex;
        gap: 6px;
        margin-top: 8px;
      }
      .reorder-btn {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        border: 1px solid var(--line);
        background: var(--ivory-warm);
        color: var(--maroon-deep);
        font-size: 13px;
        cursor: pointer;
      }
      .reorder-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      .reorder-btn:active:not(:disabled) {
        transform: scale(0.9);
      }
      .cat-card-add {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 150px;
        border: 1.5px dashed var(--gold);
        background: var(--ivory-warm);
      }
      .cat-card-add-icon {
        font-size: 30px;
        color: var(--saffron-dark);
        font-weight: 300;
        line-height: 1;
      }
      .cat-card-add .cat-card-name {
        margin-top: 6px;
        color: var(--saffron-dark);
      }

      /* ---- Category detail (drill-down view) ---- */
      .cat-detail-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .cat-detail-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .cat-detail-title h3 {
        color: var(--maroon-deep);
        font-size: 19px;
      }

      /* ---- Product cards (inside category detail) ---- */
      .prod-card-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-bottom: 20px;
      }
      .prod-card {
        background: var(--cream-card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .prod-select-checkbox {
        width: 18px;
        height: 18px;
        accent-color: var(--saffron);
        flex-shrink: 0;
        cursor: pointer;
      }
      .bulk-action-bar {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--maroon);
        color: white;
        border-radius: 12px;
        padding: 10px 14px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .bulk-action-bar span {
        font-size: 12.5px;
        font-weight: 600;
        margin-right: auto;
      }
      .bulk-action-bar .btn.secondary {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border-color: rgba(255, 255, 255, 0.3);
      }
      .prod-card-thumb {
        width: 52px;
        height: 52px;
        border-radius: 10px;
        flex-shrink: 0;
        overflow: hidden;
        background: var(--ivory-warm);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .prod-card-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .prod-card-thumb svg {
        width: 22px;
        height: 22px;
        opacity: 0.5;
      }
      .prod-card-body {
        flex: 1;
        min-width: 0;
      }
      .prod-card-name {
        font-size: 13.5px;
        font-weight: 600;
      }
      .prod-card-meta {
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 2px;
      }
      .prod-card-tags {
        margin-top: 4px;
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .prod-tag {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 6px;
      }
      .prod-tag.hidden-tag {
        background: #fdeaea;
        color: #c0392b;
      }
      .prod-tag.oos-tag {
        background: #fdefdd;
        color: #c96a0f;
      }
      .prod-card-actions {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex-shrink: 0;
      }
      .prod-card-actions .btn {
        white-space: nowrap;
      }
      .add-item-card {
        background: var(--ivory-warm);
        border: 1.5px dashed var(--gold);
        border-radius: 14px;
        padding: 16px;
      }
      .add-item-card h4 {
        color: var(--maroon-deep);
        font-size: 14px;
        margin-bottom: 12px;
      }

      /* ---- Image upload: camera + gallery buttons ---- */
      .image-upload-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 4px;
      }
      .upload-btn {
        background: var(--cream-card);
        border: 1.5px solid var(--line);
        color: var(--maroon-deep);
        padding: 8px 14px;
        border-radius: 9px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        font-family: "Poppins", sans-serif;
      }
      .upload-btn.secondary {
        background: var(--ivory-warm);
      }
      .upload-filename {
        font-size: 11px;
        color: var(--muted);
        margin-top: 6px;
      }

      .incoming-order-overlay {
        position: fixed;
        inset: 0;
        z-index: 900;
        background: rgba(107, 20, 32, 0.55);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .incoming-order-card {
        background: var(--cream-card);
        border-radius: 20px;
        padding: 24px 22px;
        max-width: 360px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 50px rgba(107, 20, 32, 0.4);
      }
      .incoming-order-icon {
        font-size: 44px;
        animation: ringShake 0.6s ease-in-out infinite;
      }
      @keyframes ringShake {
        0%,
        100% {
          transform: rotate(0deg);
        }
        25% {
          transform: rotate(-10deg);
        }
        75% {
          transform: rotate(10deg);
        }
      }
      .incoming-order-title {
        font-size: 19px;
        font-weight: 700;
        color: var(--maroon-deep);
        margin-top: 10px;
        font-family: "Cormorant Garamond", serif;
      }
      .incoming-order-detail {
        font-size: 13px;
        color: var(--muted);
        margin-top: 6px;
      }
      .incoming-order-amount {
        font-size: 22px;
        font-weight: 700;
        color: var(--saffron-dark);
        margin-top: 10px;
      }
      .incoming-order-actions {
        display: flex;
        gap: 10px;
        margin-top: 20px;
      }
      .incoming-order-actions button {
        flex: 1;
        padding: 13px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        border: none;
        font-family: "Poppins", sans-serif;
      }
      .btn-accept-order {
        background: linear-gradient(
          135deg,
          var(--marigold),
          var(--saffron-dark)
        );
        color: white;
      }
      .btn-hold-order {
        background: var(--ivory-warm);
        color: var(--maroon-deep);
        border: 1.5px solid var(--line) !important;
      }
      .held-orders-badge {
        position: fixed;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: linear-gradient(135deg, var(--maroon), var(--maroon-deep));
        color: white;
        width: 50px;
        height: 50px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(107, 20, 32, 0.4);
        z-index: 200;
        font-size: 18px;
      }
      .held-orders-badge .held-count {
        font-size: 10px;
        font-weight: 700;
        margin-top: -2px;
      }
      .held-orders-panel {
        position: fixed;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        background: var(--cream-card);
        border-radius: 16px;
        padding: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        z-index: 201;
        width: 240px;
        max-height: 320px;
        overflow-y: auto;
      }
      .held-orders-panel h4 {
        font-size: 13px;
        color: var(--maroon-deep);
        margin-bottom: 8px;
      }
      .held-order-row {
        background: var(--ivory-warm);
        border-radius: 10px;
        padding: 9px 11px;
        margin-bottom: 7px;
        cursor: pointer;
        font-size: 12px;
      }
      .held-order-row b {
        color: var(--maroon-deep);
      }
    </style>
  </head>
  <body>
    <!-- LOGIN -->
    <div id="loginScreen">
      <h1>🪔 PoojaNow Admin</h1>
      <p>Sign in with your admin account to manage orders and catalog.</p>
      <div class="form-group">
        <label>Email</label
        ><input type="email" id="loginEmail" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Password</label
        ><input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn" style="width: 100%" onclick="doLogin()">
        Log in
      </button>
      <div id="loginError"></div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard">
      <audio id="orderChimeAudio" loop>
        <source src="order_chime.wav" type="audio/wav" />
      </audio>

      <div
        class="incoming-order-overlay"
        id="incomingOrderOverlay"
        style="display: none"
      >
        <div class="incoming-order-card">
          <div class="incoming-order-icon">🔔</div>
          <div class="incoming-order-title">New order!</div>
          <div class="incoming-order-detail" id="incomingOrderDetail"></div>
          <div class="incoming-order-amount" id="incomingOrderAmount"></div>
          <div class="incoming-order-actions">
            <button class="btn-hold-order" onclick="holdIncomingOrder()">
              Hold
            </button>
            <button class="btn-accept-order" onclick="acceptIncomingOrder()">
              Accept
            </button>
          </div>
        </div>
      </div>

      <div
        class="held-orders-badge"
        id="heldOrdersBadge"
        style="display: none"
        onclick="toggleHeldPanel()"
      >
        📥
        <div class="held-count" id="heldOrdersCount">0</div>
      </div>

      <div class="held-orders-panel" id="heldOrdersPanel" style="display: none">
        <h4>Held orders</h4>
        <div id="heldOrdersList"></div>
      </div>

      <div class="topbar">
        <h1>🪔 PoojaNow Admin</h1>
        <button class="btn secondary small" onclick="doLogout()">
          Log out
        </button>
      </div>
      <div class="tabs">
        <div class="tab active" id="tabOrdersBtn" onclick="switchTab('orders')">
          Orders
        </div>
        <div class="tab" id="tabCatalogBtn" onclick="switchTab('catalog')">
          Catalog
        </div>
      </div>

      <div class="tab-content active" id="tabOrders">
        <div class="order-filter-row">
          <button
            class="filter-btn active"
            id="filterToday"
            onclick="setOrderFilter('today')"
          >
            Today
          </button>
          <button
            class="filter-btn"
            id="filterAll"
            onclick="setOrderFilter('all')"
          >
            All orders
          </button>
        </div>
        <div class="order-summary-strip" id="orderSummaryStrip"></div>
        <div id="ordersList"><div class="empty-note">Loading orders…</div></div>
      </div>

      <div class="tab-content" id="tabCatalog">
        <div class="top-actions">
          <button class="btn" onclick="seedSampleCatalog()">
            Seed sample catalog (38 items)
          </button>
        </div>
        <div id="catalogList">
          <div class="empty-note">Loading catalog…</div>
        </div>
      </div>
    </div>

    <!-- ADD CATEGORY MODAL -->
    <div class="modal-overlay" id="addCategoryModal">
      <div class="modal-box">
        <h3>Add category</h3>
        <div class="form-group">
          <label>Category name</label><input type="text" id="newCatName" />
        </div>
        <div class="form-group">
          <label>Photo</label>
          <div class="image-upload-row">
            <button
              type="button"
              class="upload-btn"
              onclick="triggerFileInput('newCatImage', true)"
            >
              📷 Take Photo
            </button>
            <button
              type="button"
              class="upload-btn secondary"
              onclick="triggerFileInput('newCatImage', false)"
            >
              🖼 Gallery
            </button>
          </div>
          <input
            type="file"
            accept="image/*"
            id="newCatImage"
            style="display: none"
            onchange="updateFileLabel('newCatImage')"
          />
          <div class="upload-filename" id="newCatImage-label"></div>
        </div>
        <div class="modal-actions">
          <button class="btn secondary" onclick="closeAddCategoryModal()">
            Cancel
          </button>
          <button class="btn" onclick="addCategory()">Save category</button>
        </div>
      </div>
    </div>

    <!-- EDIT ITEM MODAL -->
    <div class="modal-overlay" id="editModal">
      <div class="modal-box">
        <h3>Edit item</h3>
        <div class="form-group">
          <label>Item name</label><input type="text" id="editName" />
        </div>
        <div class="form-group">
          <label>Unit</label><input type="text" id="editUnit" />
        </div>
        <div class="form-group">
          <label>Price (₹)</label><input type="number" id="editPrice" />
        </div>
        <div class="form-group">
          <label>Photo</label>
          <img
            id="editImagePreview"
            class="modal-img-preview"
            style="display: none"
          />
          <div class="image-upload-row">
            <button
              type="button"
              class="upload-btn"
              onclick="triggerFileInput('editImageFile', true)"
            >
              📷 Take Photo
            </button>
            <button
              type="button"
              class="upload-btn secondary"
              onclick="triggerFileInput('editImageFile', false)"
            >
              🖼 Gallery
            </button>
          </div>
          <input
            type="file"
            accept="image/*"
            id="editImageFile"
            style="display: none"
            onchange="updateFileLabel('editImageFile')"
          />
          <div class="upload-filename" id="editImageFile-label"></div>
        </div>
        <div class="modal-actions">
          <button class="btn secondary" onclick="closeEditModal()">
            Cancel
          </button>
          <button class="btn" onclick="saveEditModal()" id="editSaveBtn">
            Save changes
          </button>
        </div>
      </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
      const STATUS_FLOW = ["placed", "packed", "out_for_delivery", "delivered"];
      const STATUS_LABELS = {
        placed: "Placed",
        packed: "Packed",
        out_for_delivery: "Out for delivery",
        delivered: "Delivered",
      };
      const CLOUDINARY_CLOUD_NAME = "uyvay5lw";
      const CLOUDINARY_UPLOAD_PRESET = "poojanow";

      const PLACEHOLDER_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="#8B2635" stroke-width="1.5"><path d="M12 2 L12 6 M8 10 C8 6 16 6 16 10 C16 14 8 14 8 18 L16 18" stroke-linecap="round"/></svg>`;

      function thumbHTML(imageUrl, name, size) {
        size = size || 36;
        if (imageUrl)
          return `<img src="${imageUrl}" alt="${name || ""}" class="thumb-img" style="width:${size}px; height:${size}px;">`;
        return `<div class="thumb-placeholder" style="width:${size}px; height:${size}px;">${PLACEHOLDER_ICON}</div>`;
      }

      async function uploadImageIfSelected(fileInputEl, pathPrefix) {
        const file = fileInputEl.files[0];
        if (!file) return null;

        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
        formData.append("folder", `poojanow/${pathPrefix}`);

        const res = await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
          { method: "POST", body: formData },
        );
        const data = await res.json();
        if (!data.secure_url) {
          console.error("Cloudinary upload failed:", data);
          throw new Error("Image upload failed");
        }
        return data.secure_url;
      }

      function triggerFileInput(inputId, useCamera) {
        const input = document.getElementById(inputId);
        if (useCamera) input.setAttribute("capture", "environment");
        else input.removeAttribute("capture");
        input.value = "";
        input.click();
      }

      function updateFileLabel(inputId) {
        const input = document.getElementById(inputId);
        const label = document.getElementById(inputId + "-label");
        if (label)
          label.textContent = input.files[0] ? `✓ ${input.files[0].name}` : "";
      }

      let categories = [];
      let products = [];
      let activeCatId = null;
      let selectedProductIds = new Set();
      let allOrders = [];
      let orderFilter = "today";
      let ordersUnsub = null,
        catUnsub = null,
        prodUnsub = null;

      let incomingQueue = [];
      let currentIncomingId = null;
      let firstOrdersSnapshotProcessed = false;
      let heldOrderIds = new Set(
        JSON.parse(localStorage.getItem("poojanow_held_orders") || "[]"),
      );

      function findOrderDoc(orderId) {
        const doc = allOrders.find((d) => d.id === orderId);
        return doc ? doc.data() : null;
      }

      function processIncomingQueue() {
        if (currentIncomingId) return;
        if (incomingQueue.length === 0) return;
        const nextId = incomingQueue.shift();
        showIncomingOrderCard(nextId, true);
      }

      function showIncomingOrderCard(orderId, ring) {
        const order = findOrderDoc(orderId);
        if (!order) {
          if (ring) processIncomingQueue();
          return;
        }
        currentIncomingId = orderId;
        document.getElementById("incomingOrderDetail").textContent =
          order.customerName +
          " · " +
          order.items.length +
          " item" +
          (order.items.length > 1 ? "s" : "");
        document.getElementById("incomingOrderAmount").textContent =
          "₹" + order.total;
        document.getElementById("incomingOrderOverlay").style.display = "flex";
        if (ring) {
          const audio = document.getElementById("orderChimeAudio");
          audio.currentTime = 0;
          audio.play().catch(() => {});
        }
      }

      function stopChime() {
        const audio = document.getElementById("orderChimeAudio");
        audio.pause();
        audio.currentTime = 0;
      }

      function acceptIncomingOrder() {
        stopChime();
        if (currentIncomingId) {
          heldOrderIds.delete(currentIncomingId);
          localStorage.setItem(
            "poojanow_held_orders",
            JSON.stringify([...heldOrderIds]),
          );
        }
        document.getElementById("incomingOrderOverlay").style.display = "none";
        currentIncomingId = null;
        renderHeldBadge();
        processIncomingQueue();
      }

      function holdIncomingOrder() {
        stopChime();
        if (currentIncomingId) {
          heldOrderIds.add(currentIncomingId);
          localStorage.setItem(
            "poojanow_held_orders",
            JSON.stringify([...heldOrderIds]),
          );
        }
        document.getElementById("incomingOrderOverlay").style.display = "none";
        currentIncomingId = null;
        renderHeldBadge();
        processIncomingQueue();
      }

      function renderHeldBadge() {
        const badge = document.getElementById("heldOrdersBadge");
        document.getElementById("heldOrdersCount").textContent =
          heldOrderIds.size;
        badge.style.display = heldOrderIds.size > 0 ? "flex" : "none";
      }

      function toggleHeldPanel() {
        const panel = document.getElementById("heldOrdersPanel");
        if (panel.style.display === "block") {
          panel.style.display = "none";
          return;
        }
        const list = document.getElementById("heldOrdersList");
        list.innerHTML =
          [...heldOrderIds]
            .map((id) => {
              const order = findOrderDoc(id);
              if (!order) return "";
              return (
                '<div class="held-order-row" onclick="openHeldOrder(\'' +
                id +
                "')\"><b>#" +
                order.orderId +
                "</b><br>" +
                order.customerName +
                " · ₹" +
                order.total +
                "</div>"
              );
            })
            .join("") ||
          '<div style="font-size:12px;color:var(--muted);">No held orders</div>';
        panel.style.display = "block";
      }

      function openHeldOrder(orderId) {
        document.getElementById("heldOrdersPanel").style.display = "none";
        showIncomingOrderCard(orderId, false);
      }
      // ============ AUTH ============
      auth.onAuthStateChanged((user) => {
        if (user) {
          document.getElementById("loginScreen").style.display = "none";
          document.getElementById("dashboard").style.display = "block";
          startListeners();
        } else {
          document.getElementById("loginScreen").style.display = "block";
          document.getElementById("dashboard").style.display = "none";
          if (ordersUnsub) ordersUnsub();
          if (catUnsub) catUnsub();
          if (prodUnsub) prodUnsub();
        }
      });

      function doLogin() {
        const email = document.getElementById("loginEmail").value.trim();
        const password = document.getElementById("loginPassword").value;
        const errBox = document.getElementById("loginError");
        errBox.style.display = "none";
        auth.signInWithEmailAndPassword(email, password).catch((err) => {
          errBox.textContent = "Login failed: " + err.message;
          errBox.style.display = "block";
        });
      }
      function doLogout() {
        auth.signOut();
      }

      function switchTab(name) {
        document
          .querySelectorAll(".tab")
          .forEach((t) => t.classList.remove("active"));
        document
          .querySelectorAll(".tab-content")
          .forEach((t) => t.classList.remove("active"));
        document
          .getElementById(
            "tab" + name.charAt(0).toUpperCase() + name.slice(1) + "Btn",
          )
          .classList.add("active");
        document
          .getElementById("tab" + name.charAt(0).toUpperCase() + name.slice(1))
          .classList.add("active");
      }

      function startListeners() {
        ordersUnsub = db
          .collection("orders")
          .orderBy("createdAt", "desc")
          .onSnapshot(
            (snap) => {
              allOrders = snap.docs;
              renderOrdersList();
              renderHeldBadge();
              if (firstOrdersSnapshotProcessed) {
                snap.docChanges().forEach((change) => {
                  if (
                    change.type === "added" &&
                    !heldOrderIds.has(change.doc.id) &&
                    !incomingQueue.includes(change.doc.id) &&
                    change.doc.id !== currentIncomingId
                  ) {
                    incomingQueue.push(change.doc.id);
                  }
                });
                processIncomingQueue();
              } else {
                firstOrdersSnapshotProcessed = true;
              }
            },
            (err) => console.error(err),
          );
        catUnsub = db
          .collection("categories")
          .orderBy("order")
          .onSnapshot(
            (snap) => {
              categories = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
              renderCatalog();
            },
            (err) => console.error(err),
          );
        prodUnsub = db.collection("products").onSnapshot(
          (snap) => {
            products = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            renderCatalog();
          },
          (err) => console.error(err),
        );
      }

      // ============ ORDERS ============
      function isToday(timestamp) {
        if (!timestamp) return false;
        return timestamp.toDate().toDateString() === new Date().toDateString();
      }

      function formatDeliveryDateAdmin(iso) {
        if (!iso) return "—";
        const date = new Date(iso);
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);
        const dateStr = date.toLocaleDateString("en-IN", {
          day: "numeric",
          month: "short",
        });
        if (date.toDateString() === today.toDateString())
          return `Today, ${dateStr}`;
        if (date.toDateString() === tomorrow.toDateString())
          return `Tomorrow, ${dateStr}`;
        return dateStr;
      }

      function setOrderFilter(f) {
        orderFilter = f;
        document
          .getElementById("filterToday")
          .classList.toggle("active", f === "today");
        document
          .getElementById("filterAll")
          .classList.toggle("active", f === "all");
        renderOrdersList();
      }

      function renderOrdersList() {
        const filtered =
          orderFilter === "today"
            ? allOrders.filter((doc) => isToday(doc.data().createdAt))
            : allOrders;

        const strip = document.getElementById("orderSummaryStrip");
        const totalAmount = filtered.reduce(
          (sum, doc) => sum + (doc.data().total || 0),
          0,
        );
        strip.innerHTML = `
      <div><div class="summary-stat-value">${filtered.length}</div><div class="summary-stat-label">${orderFilter === "today" ? "Orders today" : "Total orders"}</div></div>
      <div><div class="summary-stat-value">₹${totalAmount}</div><div class="summary-stat-label">${orderFilter === "today" ? "Today's value" : "Total value"}</div></div>`;

        const list = document.getElementById("ordersList");
        if (filtered.length === 0) {
          list.innerHTML = `<div class="empty-note">${orderFilter === "today" ? "No orders today yet." : "No orders yet. They'll show up here the moment a customer checks out."}</div>`;
          return;
        }
        list.innerHTML = filtered
          .map((doc) => {
            const o = doc.data();
            const time = o.createdAt
              ? o.createdAt.toDate().toLocaleString("en-IN", {
                  dateStyle: "medium",
                  timeStyle: "short",
                })
              : "—";
            const currentIdx = STATUS_FLOW.indexOf(o.status);
            const nextStatus = STATUS_FLOW[currentIdx + 1];
            const customerOrderCount = allOrders.filter(
              (d) => d.data().phone === o.phone,
            ).length;
            return `
          <div class="order-card">
            <div class="order-top">
              <div><div class="order-id">#${o.orderId}</div><div class="order-time">${time}</div></div>
              <span class="status-pill ${o.status}">${STATUS_LABELS[o.status] || o.status}</span>
            </div>
            <div class="order-detail-row">🚚 Delivery: <b>${formatDeliveryDateAdmin(o.deliveryDate)}</b></div>
            <div class="order-detail-row"><b>${o.customerName}</b> · ${o.phone} ${customerOrderCount > 1 ? `<span class="repeat-tag">🔁 ${customerOrderCount} orders</span>` : ""}</div>
            <div class="order-detail-row">${o.address}</div>
            ${o.location ? `<div class="order-detail-row"><a href="https://www.google.com/maps?q=${o.location.lat},${o.location.lng}" target="_blank" style="color:var(--saffron-dark);">📍 Open exact location in Google Maps</a></div>` : ""}
            <div class="order-detail-row">Payment: ${o.paymentMode === "pay_now_upi" ? "UPI" + (o.paymentConfirmed ? `<span class="paid-tag">✓ Customer marked as paid</span>` : "") : "Pay at delivery"}</div>            <div class="order-items">
              ${o.items.map((i) => `<div>${i.qty} × ${i.name} <span style="color:var(--muted);">(${i.unit || ""})</span> — ₹${i.price * i.qty}</div>`).join("")}
              <div style="margin-top:6px; font-weight:700;">Total: ₹${o.total}</div>
            </div>
            <div class="order-actions">
              ${nextStatus ? `<button class="btn small" onclick="advanceStatus('${doc.id}','${nextStatus}')">Mark as ${STATUS_LABELS[nextStatus]}</button>` : `<span style="font-size:12px; color:var(--muted);">Order complete ✓</span>`}
            </div>
            <div class="notes-row">
              <input type="text" placeholder="Internal note (only you see this)" value="${o.notes || ""}" id="note-${doc.id}">
              <button class="btn secondary small" onclick="saveNote('${doc.id}')">Save</button>
            </div>
          </div>`;
          })
          .join("");
      }

      function advanceStatus(orderId, newStatus) {
        db.collection("orders").doc(orderId).update({ status: newStatus });
      }
      function saveNote(orderId) {
        const val = document.getElementById("note-" + orderId).value;
        db.collection("orders").doc(orderId).update({ notes: val });
      }

      // ============ CATALOG ============
      function renderCatalog() {
        if (activeCatId) renderCategoryDetail(activeCatId);
        else renderCategoryGrid();
      }

      function renderCategoryGrid() {
        const list = document.getElementById("catalogList");
        const cardsHTML = categories
          .map((cat, i) => {
            const count = products.filter((p) => p.catId === cat.id).length;
            return `
        <div class="cat-card" onclick="openCategoryDetail('${cat.id}')">
          <div class="cat-card-thumb">${cat.imageUrl ? `<img src="${cat.imageUrl}" alt="${cat.name}">` : PLACEHOLDER_ICON}</div>
          <div class="cat-card-info">
            <div class="cat-card-name">${cat.name}</div>
            <div class="cat-card-count">${count} item${count === 1 ? "" : "s"}</div>
            <div class="cat-reorder-row">
              <button class="reorder-btn" onclick="event.stopPropagation(); moveCategory('${cat.id}','up')" ${i === 0 ? "disabled" : ""}>↑</button>
              <button class="reorder-btn" onclick="event.stopPropagation(); moveCategory('${cat.id}','down')" ${i === categories.length - 1 ? "disabled" : ""}>↓</button>
            </div>
          </div>
        </div>`;
          })
          .join("");
        list.innerHTML = `
        <div class="cat-grid">
          ${cardsHTML}
          <div class="cat-card cat-card-add" onclick="showAddCategoryModal()">
            <div class="cat-card-add-icon">+</div>
            <div class="cat-card-name">Add category</div>
          </div>
        </div>
            ${categories.length === 0 ? `<div class="empty-note">No categories yet. Use "Seed sample catalog" above, or tap "+ Add category" to start.</div>` : ""}`;
      }

      async function moveCategory(catId, direction) {
        const idx = categories.findIndex((c) => c.id === catId);
        const swapIdx = direction === "up" ? idx - 1 : idx + 1;
        if (swapIdx < 0 || swapIdx >= categories.length) return;
        const a = categories[idx],
          b = categories[swapIdx];
        const aOrder = a.order ?? idx;
        const bOrder = b.order ?? swapIdx;
        const batch = db.batch();
        batch.update(db.collection("categories").doc(a.id), { order: bOrder });
        batch.update(db.collection("categories").doc(b.id), { order: aOrder });
        await batch.commit();
      }

      function openCategoryDetail(catId) {
        activeCatId = catId;
        selectedProductIds.clear();
        renderCategoryDetail(catId);
      }

      function closeCategoryDetail() {
        activeCatId = null;
        selectedProductIds.clear();
        renderCategoryGrid();
      }

      function toggleProductSelection(id, checked) {
        if (checked) selectedProductIds.add(id);
        else selectedProductIds.delete(id);
        renderBulkBar();
      }

      function clearSelection() {
        selectedProductIds.clear();
        renderCategoryDetail(activeCatId);
      }

      function renderBulkBar() {
        const bar = document.getElementById("bulkActionBar");
        if (!bar) return;
        const n = selectedProductIds.size;
        if (n === 0) {
          bar.innerHTML = "";
          return;
        }
        bar.innerHTML = `
      <div class="bulk-action-bar">
        <span>${n} selected</span>
        <button class="btn small" onclick="bulkSetStock(false)">Mark out of stock</button>
        <button class="btn secondary small" onclick="bulkSetStock(true)">Mark in stock</button>
        <button class="btn secondary small" onclick="clearSelection()">Cancel</button>
      </div>`;
      }

      async function bulkSetStock(inStock) {
        const batch = db.batch();
        selectedProductIds.forEach((id) =>
          batch.update(db.collection("products").doc(id), { inStock }),
        );
        await batch.commit();
        clearSelection();
      }

      function renderCategoryDetail(catId) {
        const cat = categories.find((c) => c.id === catId);
        const list = document.getElementById("catalogList");
        if (!cat) {
          closeCategoryDetail();
          return;
        }
        const items = products.filter((p) => p.catId === catId);
        list.innerHTML = `
      <div class="cat-detail-header">
        <button class="btn secondary small" onclick="closeCategoryDetail()">← Back to categories</button>
        <div class="cat-detail-title">${thumbHTML(cat.imageUrl, cat.name, 40)}<h3>${cat.name}</h3></div>
        <button class="btn danger small" onclick="deleteCategory('${cat.id}')">Delete category</button>
      </div>
      <div id="bulkActionBar"></div>
      <div class="prod-card-list">
        ${
          items
            .map(
              (p) => `
          <div class="prod-card">
            <input type="checkbox" class="prod-select-checkbox" onchange="toggleProductSelection('${p.id}', this.checked)" ${selectedProductIds.has(p.id) ? "checked" : ""}>
            <div class="prod-card-thumb">${p.imageUrl ? `<img src="${p.imageUrl}" alt="${p.name}">` : PLACEHOLDER_ICON}</div>
            <div class="prod-card-body">
              <div class="prod-card-name">${p.name}</div>
              <div class="prod-card-meta">${p.unit || ""} · ₹${p.price}</div>
              <div class="prod-card-tags">
                ${p.active === false ? '<span class="prod-tag hidden-tag">Hidden</span>' : ""}
                ${p.inStock === false ? '<span class="prod-tag oos-tag">Out of stock</span>' : ""}
              </div>
            </div>
            <div class="prod-card-actions">
              <button class="btn secondary small" onclick="editProduct('${p.id}')">Edit</button>
              <button class="btn secondary small" onclick="toggleStock('${p.id}', ${p.inStock !== false})">${p.inStock === false ? "Mark in stock" : "Mark out"}</button>
              <button class="btn secondary small" onclick="toggleProduct('${p.id}', ${p.active !== false})">${p.active === false ? "Show" : "Hide"}</button>
                <button class="btn danger small" onclick="deleteProduct('${p.id}')">Delete</button>
              </div>
            </div>`,
            )
            .join("") ||
          `<div class="empty-note">No items in this category yet — add the first one below.</div>`
        }
        </div>
        <div class="add-item-card">
          <h4>Add item to ${cat.name}</h4>
          <div class="form-group"><label>Item name</label><input type="text" id="newItemName"></div>
          <div class="form-group"><label>Unit (e.g. 50g pack)</label><input type="text" id="newItemUnit"></div>
          <div class="form-group"><label>Price (₹)</label><input type="number" id="newItemPrice"></div>
          <div class="form-group">
            <label>Photo</label>
            <div class="image-upload-row">
              <button type="button" class="upload-btn" onclick="triggerFileInput('newItemImage', true)">📷 Take Photo</button>
              <button type="button" class="upload-btn secondary" onclick="triggerFileInput('newItemImage', false)">🖼 Gallery</button>
            </div>
            <input type="file" accept="image/*" id="newItemImage" style="display:none;" onchange="updateFileLabel('newItemImage')">
            <div class="upload-filename" id="newItemImage-label"></div>
          </div>
          <button class="btn" onclick="addProduct('${cat.id}')">Add item</button>
        </div>`;
      }

      function showAddCategoryModal() {
        document.getElementById("newCatName").value = "";
        document.getElementById("newCatImage").value = "";
        document.getElementById("newCatImage-label").textContent = "";
        document.getElementById("addCategoryModal").classList.add("open");
      }
      function closeAddCategoryModal() {
        document.getElementById("addCategoryModal").classList.remove("open");
      }

      async function addCategory() {
        const name = document.getElementById("newCatName").value.trim();
        const fileInput = document.getElementById("newCatImage");
        if (!name) {
          alert("Please enter a category name.");
          return;
        }
        const imageUrl = await uploadImageIfSelected(fileInput, "categories");
        const data = { name, order: categories.length };
        if (imageUrl) data.imageUrl = imageUrl;
        await db.collection("categories").add(data);
        closeAddCategoryModal();
      }

      async function deleteCategory(catId) {
        if (!confirm("Delete this category and all its items?")) return;
        const batch = db.batch();
        products
          .filter((p) => p.catId === catId)
          .forEach((p) => batch.delete(db.collection("products").doc(p.id)));
        batch.delete(db.collection("categories").doc(catId));
        await batch.commit();
        closeCategoryDetail();
      }

      async function addProduct(catId) {
        const name = document.getElementById("newItemName").value.trim();
        const unit = document.getElementById("newItemUnit").value.trim();
        const price = parseFloat(document.getElementById("newItemPrice").value);
        const fileInput = document.getElementById("newItemImage");
        if (!name || isNaN(price)) {
          alert("Please enter at least a name and price.");
          return;
        }
        const imageUrl = await uploadImageIfSelected(fileInput, "products");
        const data = { catId, name, unit, price, active: true, inStock: true };
        if (imageUrl) data.imageUrl = imageUrl;
        await db.collection("products").add(data);
      }

      let editingProductId = null;

      function editProduct(prodId) {
        const p = products.find((x) => x.id === prodId);
        if (!p) return;
        editingProductId = prodId;
        document.getElementById("editName").value = p.name || "";
        document.getElementById("editUnit").value = p.unit || "";
        document.getElementById("editPrice").value = p.price || "";
        document.getElementById("editImageFile").value = "";
        const preview = document.getElementById("editImagePreview");
        if (p.imageUrl) {
          preview.src = p.imageUrl;
          preview.style.display = "block";
        } else {
          preview.style.display = "none";
        }
        document.getElementById("editModal").classList.add("open");
      }

      function closeEditModal() {
        document.getElementById("editModal").classList.remove("open");
        editingProductId = null;
      }

      async function saveEditModal() {
        if (!editingProductId) return;
        const name = document.getElementById("editName").value.trim();
        const unit = document.getElementById("editUnit").value.trim();
        const price = parseFloat(document.getElementById("editPrice").value);
        if (!name || isNaN(price)) {
          alert("Please enter at least a name and a valid price.");
          return;
        }
        const btn = document.getElementById("editSaveBtn");
        btn.disabled = true;
        btn.textContent = "Saving…";
        const fileInput = document.getElementById("editImageFile");
        const newImageUrl = await uploadImageIfSelected(fileInput, "products");
        const data = { name, unit, price };
        if (newImageUrl) data.imageUrl = newImageUrl;
        await db.collection("products").doc(editingProductId).update(data);
        btn.disabled = false;
        btn.textContent = "Save changes";
        closeEditModal();
      }

      function toggleProduct(prodId, currentlyActive) {
        db.collection("products")
          .doc(prodId)
          .update({ active: !currentlyActive });
      }

      function toggleStock(prodId, currentlyInStock) {
        db.collection("products")
          .doc(prodId)
          .update({ inStock: !currentlyInStock });
      }

      function deleteProduct(prodId) {
        if (!confirm("Delete this item?")) return;
        db.collection("products").doc(prodId).delete();
      }
